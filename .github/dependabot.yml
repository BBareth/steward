version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Majors of these are migrations, not bumps. typescript-eslint pins the
      # TypeScript range it supports; the MCP SDK and discord.js change APIs.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: discord.js
        update-types: ['version-update:semver-major']
      - dependency-name: '@modelcontextprotocol/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
