name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc skips install scripts: better-sqlite3 ships prebuilt binaries.
      - name: Install dependencies
        # Advisory lookups are not a build check. Keep this aligned with the
        # Dockerfile so an unavailable audit endpoint cannot stall CI.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: steward:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the image with throwaway credentials and checks liveness,
      # readiness reporting the Discord failure, 401 without a token, 403 for
      # a foreign Host or a browser Origin, a real MCP initialize, that no
      # secret reaches the logs, and a clean SIGTERM shutdown.
      - name: Smoke test
        run: sh scripts/smoke-test.sh steward:ci
